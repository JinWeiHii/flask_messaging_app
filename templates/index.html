<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center">Real-Time Chats</h2>

    <div id="chat-box" class="border p-3 mb-3" style="height: 300px; overflow-y: scroll;"></div>

    <form id="chat-form">
      <input type="text" id="nickname" class="form-control mb-2" placeholder="Enter your nickname" required>
      <input type="text" id="message" class="form-control mb-2" placeholder="Type your message" required>
      <button type="submit" class="btn btn-primary w-100">Send</button>
    </form>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
